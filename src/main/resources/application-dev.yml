spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webtransaction_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
