spring:
  application:
    name: web-transaction-microsite
  datasource:
    url: jdbc:postgresql://localhost:5432/webtransaction
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.example.com/oauth2/default
          audiences: https://web-transaction-api

server:
  port: 8080

security:
  enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
