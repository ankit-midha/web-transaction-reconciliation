# Agent workflow — real Claude Code invocation on Bedrock.
#
# Triggered by workflow_dispatch from the merged-arch orchestrator webhook Lambda
# (https://2qezpcsfpa.execute-api.ap-southeast-2.amazonaws.com) when a Jira ticket
# transitions to READY FOR BUILD.
#
# What this workflow does (intake phase — the only phase implemented so far):
#   1. Fetches the Jira ticket via REST v3 into .workflow/ticket.json
#   2. Assumes an AWS IAM role via GitHub OIDC (no long-lived AWS keys)
#   3. Runs anthropics/claude-code-action@v1 on Bedrock (Sonnet 4.5) with prompts/intake.md
#      → Claude reads the ticket + writes .workflow/artifacts/spec.md
#   4. POSTs the spec content back to Jira as a comment on the ticket

name: Agent

on:
  workflow_dispatch:
    inputs:
      phase:
        description: intake | spec-refine | plan | plan-refine | impl-refine
        required: true
      job_id:
        description: Orchestrator job id
        required: true
      jira_key:
        description: Jira ticket key
        required: true
      attempt:
        description: Attempt number
        required: false
        default: "1"
      hint:
        description: Optional /refine hint
        required: false
        default: ""
      client_ref:
        description: Dispatcher idempotency token
        required: true

concurrency:
  # Serialise per (jira_key, phase) so a burst of dispatches doesn't fan out into
  # parallel Claude runs on the same ticket.
  group: agent-${{ inputs.jira_key }}-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  intake:
    if: inputs.phase == 'intake'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC token for AssumeRoleWithWebIdentity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Jira ticket
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -eu
          mkdir -p .workflow/artifacts
          echo "Fetching ${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}"
          curl -sSf -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}" \
            > .workflow/ticket.json
          # Sanity — did we get a real ticket back?
          jq -e '.key' .workflow/ticket.json >/dev/null
          echo "Fetched ticket: $(jq -r '.key + " — " + .fields.summary' .workflow/ticket.json)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: agent-${{ inputs.jira_key }}-intake-${{ inputs.attempt }}
          aws-region: ap-southeast-2

      - name: Run Claude Code — intake
        uses: anthropics/claude-code-action@v1
        with:
          claude_args: >-
            --model ${{ vars.BEDROCK_MODEL_ID }}
            --allowed-tools Read,Write,Edit,Bash,Grep,Glob
            --max-turns 8
          prompt: "@prompts/intake.md"
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_REGION: ap-southeast-2
          ANTHROPIC_MODEL: ${{ vars.BEDROCK_MODEL_ID }}
          JIRA_KEY: ${{ inputs.jira_key }}
          JOB_ID: ${{ inputs.job_id }}
          CLIENT_REF: ${{ inputs.client_ref }}

      - name: Post spec to Jira ticket
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ inputs.jira_key }}
        run: |
          set -eu
          if [ ! -f .workflow/artifacts/spec.md ]; then
            echo "::error::spec.md was not produced by Claude"
            exit 1
          fi
          # Jira REST v3 wants the comment body as Atlassian Document Format.
          # Simplest: one top-level codeBlock so the markdown renders literally.
          BODY=$(jq -Rs '{body:{version:1,type:"doc",content:[{type:"codeBlock",attrs:{language:"markdown"},content:[{type:"text",text:.}]}]}}' \
            < .workflow/artifacts/spec.md)
          curl -sSf -u "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -X POST "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}/comment" \
            -d "$BODY" | jq -r '"posted comment id=" + .id'

  # Placeholder job so other phases (spec-refine / plan / …) don't cause a workflow error
  # while they're still stubbed out.
  other-phases-stub:
    if: inputs.phase != 'intake'
    runs-on: ubuntu-latest
    steps:
      - name: Log unimplemented phase
        run: |
          echo "phase '${{ inputs.phase }}' not yet implemented — replace when the corresponding prompt lands"
